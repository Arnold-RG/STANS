name: Security Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit - block on HIGH and CRITICAL in production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Block on high and critical production findings
        run: npm audit --omit=dev --audit-level=high
      - name: Full audit report
        if: always()
        run: |
          npm audit > audit-report.txt || true
          npm audit --json > audit-report.json || true
      - name: Upload full audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: |
            audit-report.txt
            audit-report.json
          retention-days: 30
