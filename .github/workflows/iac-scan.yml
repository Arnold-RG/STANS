name: IaC Security Scan

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'nginx/**'
      - '.github/workflows/**'
      - 'infra/**'
      - 'k8s/**'
      - 'deploy/**'
      - 'docker-compose*.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'nginx/**'
      - '.github/workflows/**'
      - 'infra/**'
      - 'k8s/**'
      - 'deploy/**'
      - 'docker-compose*.yml'
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  checkov:
    name: Checkov - IaC misconfiguration scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov scan - Dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile
          output_format: sarif
          output_file_path: checkov-dockerfile.sarif
          soft_fail: true

      - name: Upload Dockerfile scan to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-dockerfile.sarif
          category: checkov-dockerfile

      # Checkov 3.3.29 has no nginx framework, so nginx/*.conf is not scanned here.
      - name: Checkov scan - Kubernetes
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: k8s
          framework: kubernetes
          output_format: sarif
          output_file_path: checkov-kubernetes.sarif
          soft_fail: true

      - name: Upload Kubernetes scan to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-kubernetes.sarif
          category: checkov-kubernetes

      - name: Checkov scan - GitHub Actions workflows
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .github/workflows
          framework: github_actions
          output_format: sarif
          output_file_path: checkov-actions.sarif
          soft_fail: true

      - name: Upload Actions scan to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: checkov-actions.sarif
          category: checkov-github-actions

      - name: Checkov summary
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,github_actions,kubernetes
          output_format: cli
          soft_fail: true
