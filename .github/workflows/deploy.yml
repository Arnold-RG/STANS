name: Deploy STANS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  validate:
    name: Validate build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --frozen-lockfile

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Production build
        run: npm run build
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"

      - name: Confirm build output
        run: |
          test -f dist/index.html
          echo "Build artifact is present."

  build-and-push:
    name: Build and push image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image name
        id: image
        run: echo "name=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=
            type=sha,prefix=sha-

      # ghcr.io/arnold-rg/stans already exists and is not linked to this
      # repository, so GITHUB_TOKEN push fails with write_package denied.
      # Link the package to Arnold-RG/STANS in package settings. Do not rename it here.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:latest
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  deploy:
    name: Deploy over SSH
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Check SSH secrets
        id: gate
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          if [ -n "$SSH_HOST" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SSH_HOST is not set. Skipping remote deploy. Configure GitHub Secrets to enable it."
          fi

      # metadata-action tags sha- plus the first 7 characters of the commit.
      # Computed here so the server shell does not have to be bash.
      - name: Image tag
        id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Deploy container to server
        if: steps.gate.outputs.enabled == 'true'
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG: ${{ steps.tag.outputs.value }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT || '22' }}
          envs: IMAGE,TAG,GHCR_TOKEN,ACTOR
          script: |
            set -eu
            IMAGE_REF="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
            if [ -n "${GHCR_TOKEN:-}" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
            fi
            PREV=""
            if docker inspect stans-app >/dev/null 2>&1; then
              PREV="$(docker inspect -f '{{.Config.Image}}' stans-app)"
              docker stop stans-app
              docker rename stans-app stans-app-prev
            fi
            restore() {
              docker stop stans-app >/dev/null 2>&1 || true
              docker rm stans-app >/dev/null 2>&1 || true
              if [ -n "$PREV" ]; then
                docker rename stans-app-prev stans-app
                docker start stans-app
                echo "Restored ${PREV}"
              fi
            }
            if ! docker pull "${IMAGE_REF}:${TAG}"; then
              restore
              exit 1
            fi
            if ! docker run -d \
              --name stans-app \
              --restart=always \
              --health-cmd="wget -q --spider http://127.0.0.1:8080/health || exit 1" \
              --health-interval=30s \
              --health-timeout=5s \
              --health-retries=3 \
              -p 127.0.0.1:8080:8080 \
              "${IMAGE_REF}:${TAG}"; then
              restore
              exit 1
            fi
            healthy=0
            i=0
            while [ "$i" -lt 18 ]; do
              status="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' stans-app 2>/dev/null || echo missing)"
              if [ "$status" = "healthy" ]; then
                healthy=1
                break
              fi
              if [ "$status" = "unhealthy" ]; then
                break
              fi
              i=$((i + 1))
              sleep 5
            done
            if [ "$healthy" -ne 1 ]; then
              echo "New container failed its health check."
              docker logs stans-app || true
              restore
              exit 1
            fi
            docker rm -f stans-app-prev >/dev/null 2>&1 || true
            docker image prune -f
            echo "Deployed ${IMAGE_REF}:${TAG}"
