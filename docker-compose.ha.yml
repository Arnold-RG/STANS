# Stretch: two STANS replicas behind a local Nginx load balancer.
services:
  stans-1:
    image: ${STANS_IMAGE:-stans-app:local}
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  stans-2:
    image: ${STANS_IMAGE:-stans-app:local}
    restart: always
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  loadbalancer:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./deploy/loadbalancer.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - stans-1
      - stans-2
