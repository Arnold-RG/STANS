---
- name: Deploy STANS to a Linux server
  hosts: stans
  become: true
  vars:
    stans_image: ghcr.io/arnold-rg/stans:latest
    stans_domain: ""
    letsencrypt_email: ""

  tasks:
    - name: Install Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
          - nginx
        update_cache: true

    - name: Ensure Docker is installed
      ansible.builtin.shell: |
        if ! command -v docker >/dev/null 2>&1; then
          curl -fsSL https://get.docker.com | sh
        fi
      args:
        executable: /bin/bash
      changed_when: false

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Configure UFW
      ansible.builtin.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"

    - name: Enable UFW
      ansible.builtin.ufw:
        state: enabled
        policy: deny
        direction: incoming

    - name: Pull STANS image
      community.docker.docker_image:
        name: "{{ stans_image }}"
        source: pull

    - name: Run STANS container
      community.docker.docker_container:
        name: stans-app
        image: "{{ stans_image }}"
        restart_policy: always
        published_ports:
          - "127.0.0.1:8080:80"
        healthcheck:
          test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
          interval: 30s
          timeout: 5s
          retries: 3

    - name: Configure host Nginx
      when: stans_domain | length > 0
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/stans
        content: |
          upstream stans_app { server 127.0.0.1:8080; }
          server {
              listen 80;
              server_name {{ stans_domain }};
              location / {
                  proxy_pass http://stans_app;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }

    - name: Enable site
      when: stans_domain | length > 0
      ansible.builtin.file:
        src: /etc/nginx/sites-available/stans
        dest: /etc/nginx/sites-enabled/stans
        state: link

    - name: Reload Nginx
      when: stans_domain | length > 0
      ansible.builtin.service:
        name: nginx
        state: reloaded
