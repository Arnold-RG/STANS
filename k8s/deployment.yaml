apiVersion: apps/v1
kind: Deployment
metadata:
  name: stans
  namespace: stans
  labels:
    app: stans
  annotations:
    checkov.io/skip1: CKV_K8S_14=Publish workflow tags latest. Pin a digest once GHCR is linked to this repo.
    checkov.io/skip2: CKV_K8S_43=A digest pin would drift from the tag deploy.yml pushes.
    checkov.io/skip3: CKV_K8S_40=uid 101 is the nginx user in the runtime image. A uid over 10000 cannot bind port 80 once capabilities are dropped.
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stans
  template:
    metadata:
      labels:
        app: stans
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stans
          image: ghcr.io/arnold-rg/stans:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
