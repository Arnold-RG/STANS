apiVersion: apps/v1
kind: Deployment
metadata:
  name: stans
  namespace: stans
  labels:
    app: stans
  annotations:
    checkov.io/skip1: CKV_K8S_14=Static manifest still uses latest. TODO pin sha-<short> from deploy.yml once a renderer supplies the commit.
    checkov.io/skip2: CKV_K8S_43=Same TODO. A digest is not known until the image push, and this file is not rendered at deploy time.
spec:
  replicas: 2
  selector:
    matchLabels:
      app: stans
  template:
    metadata:
      labels:
        app: stans
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stans
          # TODO: use the sha-<7-char commit> tag deploy.yml already pushes
          # (docker/metadata-action type=sha,prefix=sha-). This file is applied
          # as-is, so it cannot know that tag until something renders it.
          image: ghcr.io/arnold-rg/stans:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: cache
              mountPath: /var/cache/nginx
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
